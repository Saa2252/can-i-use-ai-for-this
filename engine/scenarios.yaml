# The 21 golden scenarios of BUILD_SPEC 6, as data.
#
# They are the tests, the quiz and the input to the Review page's "verdict
# changed" diff, so they live in one reviewable file rather than being
# duplicated in three places.
#
# `expect` and `must_cite` come straight from the BUILD_SPEC 6 table and are
# checked against it by tests/test_scenarios.py. If a verdict disagrees with
# them, the rule is wrong or the policy is ambiguous: log it in
# OPEN_QUESTIONS.md. Never edit a scenario to make a test pass (BUILD_SPEC 6).
#
# `quiz_locked: true` marks the four the quiz must always include.

- n: 1
  title: Summarize a public news article in personal ChatGPT
  inputs: { data_class: Public, tool: C, activity: drafting }
  expect: ALLOWED
  must_cite: ["7.1", "8.10"]

- n: 2
  title: Paste a client contract into personal ChatGPT
  inputs: { data_class: Confidential, tool: C, activity: drafting, data_kind: client_info }
  expect: PROHIBITED
  must_cite: ["6.7"]

- n: 3
  title: Draft an internal memo in the approved enterprise tool
  inputs: { data_class: Internal, tool: A, activity: drafting }
  expect: ALLOWED
  must_cite: ["8.10"]

- n: 4
  title: Summarize an email thread that names colleagues
  inputs:
    { data_class: Internal, tool: A, activity: drafting, data_kind: ordinary_personal }
  expect: ALLOWED
  must_cite: ["7.5", "8.10"]
  quiz_locked: true

- n: 5
  title: AI auto-rejects CVs, no human review
  inputs:
    data_class: Confidential
    tool: A
    activity: decision_about_person
    human_review: false
    hiring: true
  expect: PROHIBITED
  must_cite: ["6.6", "8.1"]

- n: 6
  title: AI ranks CVs, a recruiter decides
  inputs:
    data_class: Confidential
    tool: A
    activity: decision_about_person
    human_review: true
    hiring: true
  expect: NEEDS_APPROVAL
  approval_kind: one_time_use_case
  must_cite: ["8.1", "HR.1"]

- n: 7
