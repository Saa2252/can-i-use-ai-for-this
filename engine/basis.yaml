# --- 8.1 and HR.1 ---------------------------------------------------------
- clause: "8.1"
  type: law
  source: "EU AI Act Annex III (high-risk); Colorado SB 26-189"
  jurisdiction: "EU; US-CO"
  status: "2 Dec 2027; 1 Jan 2027 (CO enforcement stayed)"
  checked: 2026-11-11
  note: >-
    The omnibus fixed Annex III standalone systems at 2 Dec 2027 and Annex I
    product-embedded ones at 2 Aug 2028. Colorado SB 26-189 replaced SB 24-205
    and applies from 1 Jan 2027, but a federal court stayed enforcement in
    Apr 2026 and the Attorney General's rulemaking is unfinished, so the date
    is less settled than it looks.

- clause: "HR.1"
  type: law
  source: "EU AI Act Annex III (high-risk); Colorado SB 26-189"
  jurisdiction: "EU; US-CO"
  status: "2 Dec 2027; 1 Jan 2027 (CO enforcement stayed)"
  checked: 2026-11-11
  note: "Same position as 8.1; Art. 26(7) worker-representative notice applies too."

