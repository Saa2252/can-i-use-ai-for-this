# Rules for AI Acceptable Use Policy AIG-POL-001 v1.6
#
# Generated from rules_v1_5.yaml. v1.6 closes procedural gaps rather than
# changing what anyone may do, so NO VERDICT CHANGES between v1.5 and v1.6.
# What changes is what a verdict obliges the organization to do: three rules
# gain clauses and requirements that v1.5 had no clause for. The Changes page
# shows that as citations moving while statuses hold, which is the point.
#
# Every rule cites clause ids that must exist in the parsed v1.6 policy
# (enforced by tests/test_clause_integrity.py). `reason` is plain English
# written for the visitor; it never stands in for clause text, which the card
# loads from the policy file itself.
#
# Evaluation: every rule is tested, every fired rule contributes its clauses,
# reasons and requirements, and the status is the most severe that fired.
# PROHIBITED > NOT_PERMITTED > NEEDS_APPROVAL > ALLOWED.

# ===========================================================================
# Classification notes. These fire at the ALLOWED floor: they add the clause
# that explains how the data was classified without changing the status.
# ===========================================================================

- id: classification_whole_interaction
  when: {}
  then:
    status: ALLOWED
    reason: >-
      Classify the whole interaction, not just the attachment: what you type,
      anything the tool can see, and any file you attach. The highest class
      present decides which tool you may use.
    clauses: ["7.2"]
    why_it_matters: >-
      One Confidential line in a prompt decides the tool for the whole
      conversation, not just for the file you attached.
    next_step: >-
      Look at the prompt, the attachment and anything the tool can already see,
      and take the highest class you find (7.2).

- id: note_ordinary_personal_data
  when: { data_kind: ordinary_personal }
  then:
    status: ALLOWED
    reason: >-
      A colleague's name or work email in a document does not make the data
      sensitive. It is Internal or Confidential, not Restricted.
    clauses: ["7.5"]
    why_it_matters: >-
      Treating every mention of a person as Restricted stops ordinary work
      without protecting anyone.
    next_step: >-
      Classify it under the Data Classification Standard as Internal or
      Confidential, not Restricted (7.5).

- id: note_sensitive_personal_data
  when: { data_kind: sensitive_personal }
  then:
    status: ALLOWED
    reason: Sensitive personal data is Restricted, which narrows you to an approved use case.
    clauses: ["7.4"]
    why_it_matters: >-
      Sensitive personal data is where a leak does lasting harm to a real
      person, so 7.4 pins it to Restricted whatever else is in the file.
    next_step: >-
      Treat it as Restricted: it needs an approved, registered use case before
      it goes into any tool (7.4, 8.6).

- id: note_hr_health_record
  when: { data_kind: hr_health_record }
  then:
    status: ALLOWED
    reason: >-
      An HR record containing health data, such as a sick-leave note or a
      medical accommodation, stays Restricted even though ordinary HR files are
      only Confidential.
    clauses: ["7.4", "7.5"]
    why_it_matters: >-
      An HR file reads as ordinary until there is health data in it, which is
      the classification people get wrong most often.
    next_step: >-
      Treat the whole record as Restricted rather than Confidential, and get the
      use case approved first (7.4, 8.6).

- id: note_client_information
  when: { data_kind: client_info }
  then:
    status: ALLOWED
    reason: >-
      For AI use, a client's identity and any non-public information about them
      are Confidential, even if nothing else in the document is.
    clauses: ["B.2.3", "7.6"]
    why_it_matters: >-
      A client's name can be the confidential part even when everything else in
      the document is dull.
    next_step: >-
      Treat it as Confidential, which keeps it out of Tier B and Tier C tools
      (B.2.3, 7.1).

- id: personal_data_minimisation
  when:
    data_kind: [ordinary_personal, sensitive_personal, hr_health_record]
  then:
    status: ALLOWED
    reason: Personal data needs a lawful basis, a compatible purpose, and the minimum amount.
    clauses: ["7.3", "7.7"]
    requirements:
      - "A lawful basis for the personal data, and a compatible purpose"
      - "The minimum data needed; prefer de-identified data"
      - "Access, correction and deletion requests followed into tool histories, agent
         memory, meeting transcripts, derived indexes and logs"
    why_it_matters: >-
      Personal data does not stay in the prompt: it spreads into tool histories,
      agent memory, transcripts and logs that a deletion request still has to
      reach.
    next_step: >-
      Name the lawful basis, cut the data to the minimum, and prefer a
      de-identified version (7.3, 7.7).

# ===========================================================================
# Data rules: the 7.1 table, always applied
# ===========================================================================

- id: data_secrets_never
  when: { data_class: Secrets }
  then:
    status: PROHIBITED
    reason: >-
      Passwords, API keys, tokens and private keys never go into any AI tool,
      in any tier. There is no approval route and no exception.
    clauses: ["6.3", "7.1"]
    requirements:
      - "If a secret has already been exposed, report it within 24 hours and rotate it"
    why_it_matters: >-
      A key pasted into a prompt has left the organization's control, and no
      approval afterwards can take it back.
    next_step: >-
      Do not paste it anywhere; treat a credential that has already gone in as
      exposed, and rotate it (6.3).

- id: data_tier_c_non_public
  when:
    all_of:
      - { effective_tier: C }
      - { data_class: [Internal, Confidential, Restricted] }
  then:
    status: PROHIBITED
    reason: >-
      An unapproved or personal AI account is Tier C, and nothing other than
      public information may go into it.
    clauses: ["6.7", "7.1"]
    why_it_matters: >-
      A personal AI account sits outside every contract the organization has, so
      whatever goes in is no longer governed by one.
    next_step: >-
      Move the work into an approved Tier A tool, or keep it to public
      information (7.1).

- id: data_tier_b_above_internal
  when:
    all_of:
      - { effective_tier: B }
      - { data_class: [Confidential, Restricted] }
  then:
    status: NOT_PERMITTED
    reason: A Tier B tool is vetted but misses some Tier A controls, so it stops at Internal.
    clauses: ["7.1"]
    try_instead: >-
      Use an approved Tier A tool for this data, or have IT and Security assess
      the tool against the Tier A criteria in B.1.2.
    why_it_matters: >-
      Tier B was assessed and found short of some Tier A controls, and
      Confidential data is exactly what those controls protect.
    next_step: >-
      Use an approved Tier A tool, or ask IT and Security to assess this one
      against B.1.2 — the Standard route targets 10 working days (B.4).

- id: data_restricted_in_tier_a
  when:
    all_of:
      - { effective_tier: A }
      - { data_class: Restricted }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      Restricted data is allowed in a Tier A tool only for a registered use
      case that has been approved for it.
    clauses: ["8.6", "7.1"]
    requirements:
      - "A registered use case and an impact assessment sized by the B.3 rubric"
      - "A named human reviewer, and logging"
      - "AI Governance Committee approval of Tier A status for a tool holding Restricted data"
    why_it_matters: >-
      Restricted data in an approved tool is still Restricted; the approval is
      what ties it to one purpose and one reviewer.
    next_step: >-
      Submit the use case through the AI intake form — the Approval route
      targets 20 working days (14.1, B.4).

- id: data_personal_selfhosted_non_public
  when:
    all_of:
      - { effective_tier: personal_selfhosted }
      - { data_class: [Internal, Confidential, Restricted, Secrets] }
  then:
    status: NOT_PERMITTED
    reason: >-
      A model on a personal or unmanaged device may be used with public data
      only. Organizational servers or the organization's own cloud tenancy are
      the only hosts that can reach Tier A.
    clauses: ["2.3", "B.1.3"]
    try_instead: >-
      Run the model on organizational servers or the organization's cloud
      tenancy, or use an approved Tier A tool. On a managed company laptop the
      same model is Tier B at most, so it still stops at Internal data.
    why_it_matters: >-
      A model on an unmanaged device puts work data on hardware the organization
      cannot patch, wipe or audit.
    next_step: >-
      Run it on organizational servers or the organization's cloud tenancy, or
      move the work to an approved tool (B.1.3).

- id: data_public_any_tier
  when: { data_class: Public }
  then:
    status: ALLOWED
    reason: Public information may go into any tier, including a personal account.
    clauses: ["7.1"]
    why_it_matters: >-
      Public information is the one class whose exposure costs nothing, which is
      why the 7.1 grid opens every tier to it.
    next_step: >-
      Go ahead, and check the output before you rely on it (9.2).

- id: data_internal_tier_a_or_b
  when:
    all_of:
      - { data_class: Internal }
      - { effective_tier: [A, B] }
  then:
    status: ALLOWED
    reason: Internal data is allowed in Tier A and Tier B tools.
    clauses: ["7.1"]
    why_it_matters: >-
      Internal data is where most work actually happens, so the policy keeps two
      tiers open to it rather than one.
    next_step: >-
      Go ahead, and keep anything Confidential out of the same conversation
      (7.2).

- id: data_confidential_tier_a
  when:
    all_of:
      - { data_class: Confidential }
      - { effective_tier: A }
  then:
    status: ALLOWED
    reason: Confidential data is allowed in a Tier A tool.
    clauses: ["7.1"]
    why_it_matters: >-
      Tier A is the only tier assessed against the controls that Confidential
      data needs.
    next_step: >-
      Go ahead, and keep the work in this tool rather than copying it out into
      another one (7.1).

- id: client_data_training_without_permission
  when:
    all_of:
      - { training_or_finetuning: true }
      - { client_contract_allows: false }
  then:
    status: PROHIBITED
    reason: >-
      Client data is not uploaded to an AI service, or used to train or
      fine-tune a model, where the client contract does not allow it. If the
      contract is silent, the answer is no.
    clauses: ["6.8", "7.6"]
    why_it_matters: >-
      Training is irreversible: a model that has learned from client data cannot
      unlearn it, and the client never agreed to it.
    next_step: >-
      Have the contract checked before anything is uploaded; a contract that is
      silent means no (7.6).

# ===========================================================================
# Self-hosted and open-weight models
# ===========================================================================

- id: selfhosted_on_org_infrastructure
  when:
    all_of:
      - { tool: self_hosted }
      - { host: org_cloud }
  then:
    status: ALLOWED
    reason: >-
      A self-hosted model on organizational servers or the organization's cloud
      tenancy can reach Tier A, but only if every B.1.3 criterion is met.
      Self-hosting removes vendor risk and adds supply-chain, patching and
      safety-tuning risk; it is not automatically safer.
    clauses: ["B.1.3"]
    requirements:
      - "Model from an approved source, integrity checked by hash or signature"
      - "A licence permitting the intended commercial use"
      - "No outbound data or telemetry from the model environment"
      - "Access control tied to SSO, and logging of use"
      - "A named owner responsible for patching and updates"
      - "An evaluation for fitness, basic safety and prompt injection"
    why_it_matters: >-
      Self-hosting trades vendor risk for risks the organization now owns
      itself: the weights, the patching and the logs.
    next_step: >-
      Meet every B.1.3 criterion and register the model before it is used
      (B.1.3).

- id: selfhosted_on_managed_laptop
  when:
    all_of:
      - { tool: self_hosted }
      - { host: managed_laptop }
  then:
    status: ALLOWED
    reason: A model on a managed company laptop is Tier B at most, so it stops at Internal data.
    clauses: ["B.1.3"]
    why_it_matters: >-
      A laptop cannot give the isolation and logging that Tier A assumes,
      however capable the model running on it is.
    next_step: >-
      Keep it to Internal data, or move the model onto organizational
      infrastructure (B.1.3, 7.1).

# ===========================================================================
# Activities
# ===========================================================================

- id: activity_drafting
  when: { activity: drafting }
  then:
    status: ALLOWED
    reason: >-
      Drafting, summarizing, translating, research and analysis are permitted
      in approved tools within the data rules. You check the output.
    clauses: ["8.10", "9.2"]
    requirements:
      - "Verify facts, figures, citations and legal, financial, medical or technical claims
         against a reliable source before they go into anything external or any decision"
    why_it_matters: >-
      Drafting is the use that makes AI worth having, and the only thing it asks
      of you is that you read what comes back.
    next_step: >-
      Go ahead, and check the output before it leaves your hands (9.2).

- id: activity_coding
  when: { activity: coding }
  then:
    status: ALLOWED
    reason: >-
      Coding help is permitted in approved tools. AI-written code gets the same
      review, testing, security scanning and licence checks as any other code.
    clauses: ["8.10", "9.3", "B.5.1"]
    requirements:
      - "The same review, testing, security scanning and licence checks as any other code"
      - "The assistant configured to exclude secret files from its context"
    why_it_matters: >-
      AI-written code carries the same defects and licence obligations as any
      other code, and reaches production the same way.
    next_step: >-
      Put it through the usual review, testing, security scanning and licence
      checks (9.3).

- id: activity_decision_about_person
  when: { activity: decision_about_person }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      A decision with a legal or similarly significant effect on a person is a
      use that needs approval before it starts.
    clauses: ["8.1", "8.12", "9.4", "10.3", "10.5"]
    requirements:
      - "A registered use case, an impact assessment sized by the B.3 rubric, and logging"
      - "The assessment produced in the form the law names where it names one, such as a
         fundamental rights impact assessment; it may cross-refer to the data protection
         impact assessment rather than repeat it"
      - "A reviewer with the authority and competence to overrule the AI, who sees the
         main factors behind its output and records the decision"
      - "The person told before AI materially influences the decision, and given a
         plain-language explanation after an adverse outcome"
      - "Workers' representatives informed before it is put into use at work, and consulted
         where local law gives them that right"
    why_it_matters: >-
      A decision with a legal or similarly significant effect is the point where
      AI stops being a tool and starts changing someone's life.
    next_step: >-
      Submit it through the AI intake form before it starts — the Approval route
      targets 20 working days (14.1, B.4).

- id: decision_without_human_review
  when:
    all_of:
      - { activity: decision_about_person }
      - { human_review: false }
  then:
    status: PROHIBITED
    reason: >-
      A consequential decision about a person may never rest on AI output
      alone. Meaningful human review is not optional.
    clauses: ["6.6"]
    why_it_matters: >-
      With nobody able to overrule it, there is nobody to answer for the
      decision and nobody for the person to appeal to.
    next_step: >-
      Give a named person the authority and the information to overrule the
      output, or do not run it (6.6, 3.1).

- id: decision_hiring_context
  when:
    all_of:
      - { activity: decision_about_person }
      - { hiring: true }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      AI in recruiting, promotion, performance, scheduling or termination needs
      anti-bias testing before and after deployment.
    clauses: ["HR.1", "HR.6"]
    requirements:
      - "Anti-bias testing before and after deployment"
      - "Candidates and employees notified before AI is used"
      - "Workers' representatives informed before deployment; where a works council or
         equivalent must agree, its agreement recorded with the approval"
      - "Decision records kept for at least 4 years, or longer where local law requires"
    why_it_matters: >-
      Hiring and performance tools learn from past decisions, so bias testing is
      the only thing standing between history and repetition.
    next_step: >-
      Submit it with anti-bias testing planned before and after deployment — the
      Approval route targets 20 working days (HR.1, B.4).

- id: activity_chatbot
  when: { activity: chatbot }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: Customer-facing and public-facing AI needs approval, and has to say it is AI.
    clauses: ["8.2", "10.1"]
    requirements:
      - "A registered use case, a named human reviewer, and logging"
      - "The chatbot discloses that it is AI, and offers a person on request"
    why_it_matters: >-
      Someone talking to a chatbot that never says it is one cannot judge what
      they are being told.
    next_step: >-
      Submit the use case, and make the AI disclosure part of the first thing it
      says (8.2, 10.1).

- id: activity_publishing
  when: { activity: publishing }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      Publishing AI-generated content externally under the organization's name
      needs approval, and the disclosure rules in 10.2 decide whether it
      carries an AI label.
    clauses: ["8.3", "10.2", "12.2"]
    requirements:
      - "A named person who reviews it and takes editorial responsibility, or an
         AI-generated label"
      - "Checked for close copies of protected material, third-party trademarks, and
         open-source code under incompatible licences"
    why_it_matters: >-
      Published AI content carries the organization's name, so a mistake becomes
      its statement rather than someone's draft.
    next_step: >-
      Submit it for approval and apply the 10.2 disclosure test before it goes
      out (8.3, 10.2).

- id: activity_synthetic_media
  when: { activity: synthetic_media }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: Synthetic images, audio or video of a real, identifiable person need approval.
    clauses: ["8.4"]
    requirements:
      - "Written consent from the person"
      - "An AI label on the result"
    why_it_matters: >-
      A synthetic likeness can be convincing to everyone except the person it
      depicts.
    next_step: >-
      Submit it for approval, with the person's consent recorded (8.4).

- id: synthetic_media_intimate
  when:
    all_of:
      - { activity: synthetic_media }
      - { sexual_or_intimate: true }
  then:
    status: PROHIBITED
    reason: >-
      Creating or altering sexual or intimate imagery of a real person is
      prohibited outright. No consent, approval or exception makes it available.
    clauses: ["6.2"]
    why_it_matters: >-
      Intimate imagery of a real person is an injury to that person, and that
      does not change with consent, purpose or approval.
    next_step: >-
      There is no route: do not create or alter it, and report anything you find
      (6.2).

- id: activity_monitoring_employees
  when: { activity: monitoring_employees }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: Using AI to monitor or evaluate employees needs approval before it starts.
    clauses: ["8.7"]
    requirements:
      - "A registered use case, a named human reviewer, and logging"
      - "Staff told what is monitored, in line with privacy and employment law"
    why_it_matters: >-
      Monitoring changes how people behave long before it catches anything, so
      it is a decision to take openly.
    next_step: >-
      Submit it for approval before any monitoring starts — the Approval route
      targets 20 working days (8.7, B.4).

- id: activity_emotion_recognition
  when: { activity: emotion_recognition }
  then:
    status: PROHIBITED
    reason: >-
      Emotion recognition in the workplace or in education is a prohibited
      practice, wherever in the world it takes place.
    clauses: ["6.1"]
    why_it_matters: >-
      Inferring emotion from a face or a voice is unreliable science used to
      make real judgements about real people.
    next_step: >-
      There is no route: use a method that measures what people do rather than
      what a model thinks they feel (6.1).

- id: activity_fatigue_detection
  when: { activity: fatigue_detection }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      Detecting a physical state such as fatigue, for safety, is a use that
      needs approval rather than a prohibited practice. It is both employee
      monitoring and a safety-critical use, and it relies on a stated exclusion
      in the law, so the legal text and its exclusions govern.
    clauses: ["8.7", "8.8"]
    requirements:
      - "A full impact assessment: this is High risk under the B.3 rubric"
      - "Legal and Privacy confirm the use falls inside a stated exclusion"
      - "Staff told what is monitored"
    why_it_matters: >-
      Detecting a physical state for safety is a genuine use, and it sits one
      step away from the emotion recognition the policy bans outright.
    next_step: >-
      Submit it for approval as both employee monitoring and a safety-critical
      use (8.7, 8.8).

- id: activity_safety_critical
  when: { activity: safety_critical }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      AI in safety-critical, clinical or physical operations needs approval, and
      the sector rules in Part D apply as well.
    clauses: ["8.8"]
    requirements:
      - "A full impact assessment, with testing for bias and failure modes"
      - "The relevant Part D sector annex applied on top of Parts A to C"
    why_it_matters: >-
      In safety-critical and clinical work the cost of a wrong output is
      measured in harm, not in rework.
    next_step: >-
      Submit it for approval, and check the Part D annex for your sector (8.8).

- id: activity_connecting_systems
  when: { activity: connecting_systems }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      Connecting an AI tool to a new internal system or data source through a
      plugin, connector, MCP server or API is a new use case.
    clauses: ["8.9", "11.9"]
    requirements:
      - "A registered use case before the connection is made"
      - "Everything the tool can read through the connector counted in the classification"
    why_it_matters: >-
      A connector hands the tool everything on the other side of it, which is a
      far larger decision than setting it up makes it look.
    next_step: >-
      Submit the connection as a new use case before it is switched on (8.9).

- id: notetaker_ordinary_meeting
  when:
    all_of:
      - { activity: notetaker }
      - { meeting_type: ordinary }
  then:
    status: ALLOWED
    reason: >-
      An approved notetaker is allowed in an ordinary meeting, as long as
      everyone is told at the start.
    clauses: ["8.11", "B.6.1", "B.6.2", "B.6.4"]
    requirements:
      - "An approved notetaker tool; personal notetaker bots are Tier C"
      - "The host announces recording and AI notes at the start, with notice in the
         invite for external participants"
      - "Where local law requires every participant's consent, the host gets it first,
         and switches the notetaker off if anyone objects"
      - "The host reviews the summary before it is shared"
    why_it_matters: >-
      A recorded meeting becomes a document that outlives the conversation, and
      people speak differently once they know.
    next_step: >-
      Say at the start that it is recording, and keep the transcript only for
      its retention period (B.6.1, B.6.4).

- id: notetaker_excluded_meeting
  when:
    all_of:
      - { activity: notetaker }
      - { meeting_type: [legal_counsel, hr_casework, board_exec, undisclosed_deal] }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      Notetakers are kept out of meetings with legal counsel, HR disciplinary,
      grievance or medical discussions, board executive sessions and meetings
      about undisclosed transactions, unless the Committee approves that
      specific case.
    clauses: ["B.6.3"]
    requirements:
      - "AI Governance Committee approval of this specific case"
    why_it_matters: >-
      Legal privilege, an HR case and an undisclosed transaction are all things
      a transcript can damage simply by existing.
    next_step: >-
      Take notes by hand, or ask the Committee to approve this meeting type in
      advance (B.6.3).

# ===========================================================================
# AI agents (11.x and C.x, as amended in v1.5)
# ===========================================================================

- id: agent_registration_and_controls
  when: { activity: agent }
  then:
    status: ALLOWED
    reason: >-
      Every agent is registered with a named human owner, runs on its own
      identity with least privilege, and is logged, monitored and killable.
    clauses: ["11.1", "11.2", "11.5", "11.6", "11.8", "C.1.1", "C.1.2"]
    requirements:
      - "Registered in the AI register with a named human owner"
      - "Its own service identity and least privilege; never a person's full credentials"
      - "Credentials only from the approved secrets manager, as short-lived scoped tokens"
      - "All actions logged in a form audit can review"
      - "A tested kill switch and a way to roll back its actions"
      - "Staged rollout, with users told what it can do and who to contact"
    why_it_matters: >-
      An agent acts while nobody is watching, so the register and the kill
      switch are how a person stays answerable for it.
    next_step: >-
      Register it with a named owner, its own identity and least privilege
      before it runs (11.1, 11.2).

- id: agent_untrusted_content
  when: { activity: agent }
  then:
    status: ALLOWED
    reason: >-
      Anything the agent reads is untrusted data, never an instruction. An
      agent that reads email, the web or shared documents is tested for prompt
      injection before release and after each significant change.
    clauses: ["11.4", "C.3"]
    requirements:
      - "Prompt-injection testing before release and after each significant change"
    why_it_matters: >-
      An agent that treats what it reads as instructions can be told what to do
      by anyone who can get text in front of it.
    next_step: >-
      Test it for prompt injection before release and after each significant
      change (C.3).

- id: agent_memory
  when: { activity: agent }
  then:
    status: ALLOWED
    reason: >-
      Memory that persists between tasks is a data store under Section 7. It
      never holds Secrets, and holds Restricted data only where the approved
      use case allows it.
    clauses: ["11.7", "C.4.1"]
    requirements:
      - "The owner can inspect and purge the memory"
      - "A retention period set at approval, after which memory is deleted automatically"
    why_it_matters: >-
      Agent memory is a data store nobody remembers to classify, and it keeps
      what the conversation forgot.
    next_step: >-
      Treat memory as storage under Section 7: no Secrets, and Restricted data
      only where the approved use case allows it (11.7).

- id: agent_read_only
  when:
    all_of:
      - { activity: agent }
      - { agent_action: read }
  then:
    status: ALLOWED
    reason: Agents are read-only by default, which is the setting that needs no action approval.
    clauses: ["11.3"]
    why_it_matters: >-
      Read-only is the setting where a mistake costs an explanation rather than
      a reversal.
    next_step: >-
      Keep it read-only unless a specific action has been approved for it
      (11.3).

- id: agent_write_rights
  when:
    all_of:
      - { activity: agent }
      - { agent_action: [write, pay, delete, message_external, production_change] }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      An agent with rights to write, send, pay, delete or communicate
      externally is a use that needs approval before it is switched on.
    clauses: ["8.5"]
    requirements:
      - "A registered use case, an impact assessment, a named human reviewer, and logging"
      - "Limits recorded in the agent's register entry: spend, rate, recipients,
         data scope and tools"
    why_it_matters: >-
      The moment an agent can write, send, pay or delete, its mistakes stop
      being drafts.
    next_step: >-
      Submit the use case before the rights are switched on — the Approval route
      targets 20 working days (8.5, B.4).

- id: agent_payment_in_cap_to_allowlisted_payee
  when:
    all_of:
      - { activity: agent }
      - { agent_action: pay }
      - { payee_on_allowlist: true }
      - { within_caps: true }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      An in-cap payment to an allowlisted payee is one of only two irreversible
      actions an agent may take without approval for each action. It still
      needs the use case approved once, with the Committee accepting that risk.
    clauses: ["11.3", "C.2"]
    requirements:
      - "Committee risk acceptance"
      - "caps / allowlist set in C.2"
    why_it_matters: >-
      The cap and the allowlist are what keep an unattended payment small enough
      to put right.
    next_step: >-
      Get the use case approved once, with the Committee accepting the cap and
      the allowlist (11.3, C.2).

- id: agent_payment_outside_allowance
  when:
    all_of:
      - { activity: agent }
      - { agent_action: pay }
      - any_of:
          - { payee_on_allowlist: false }
          - { within_caps: false }
  then:
    status: NEEDS_APPROVAL
    approval_kind: per_action
    reason: >-
      A payment above the cap, or to a payee who is not on the allowlist, falls
      outside the exception and needs a human to approve that payment.
    clauses: ["11.3", "C.2"]
    requirements:
      - "Human approval for this payment, before it is made"
    why_it_matters: >-
      Outside the cap or the allowlist there is nothing left to limit what a
      single mistake can send.
    next_step: >-
      Have a human approve that payment before it goes (11.3).

- id: agent_message_to_allowlisted_recipient
  when:
    all_of:
      - { activity: agent }
      - { agent_action: message_external }
      - { recipient_on_allowlist: true }
      - { within_caps: true }
  then:
    status: NEEDS_APPROVAL
    approval_kind: one_time_use_case
    reason: >-
      A message to an allowlisted recipient within the rate limit is the second
      of the two irreversible actions an agent may take without approval for
      each action. The use case is approved once, with the Committee accepting
      that risk.
    clauses: ["11.3", "C.2"]
    requirements:
      - "Committee risk acceptance"
      - "caps / allowlist set in C.2"
    why_it_matters: >-
      A message that leaves the organization cannot be recalled, so the
      allowlist decides who an unattended agent can reach.
    next_step: >-
      Get the use case approved once, with the Committee accepting the rate
      limit and the allowlist (11.3, C.2).

- id: agent_message_outside_allowance
  when:
    all_of:
      - { activity: agent }
      - { agent_action: message_external }
      - any_of:
          - { recipient_on_allowlist: false }
          - { within_caps: false }
  then:
    status: NEEDS_APPROVAL
    approval_kind: per_action
    reason: >-
      A message to anyone not on the recipient allowlist, or beyond the rate
      limit, needs a human to approve that message.
    clauses: ["11.3", "C.2"]
    requirements:
      - "Human approval for this message, before it is sent"
    why_it_matters: >-
      An unapproved message to an unapproved recipient is how an agent speaks
      for the organization to someone it was never meant to reach.
    next_step: >-
      Have a human approve that message before it is sent (11.3).

- id: agent_adds_payee
  when:
    all_of:
      - { activity: agent }
      - { agent_action: add_payee }
  then:
    status: NOT_PERMITTED
    reason: >-
      Adding a payee to the allowlist is never done by an agent. The allowlist
      is the control; an agent that can extend it has no limit at all.
    clauses: ["C.2"]
    try_instead: a human adds it, and it is logged
    why_it_matters: >-
      An agent that can add to its own allowlist does not have one.
    next_step: >-
      A human adds the payee, and the change is logged (C.2).

- id: agent_adds_recipient
  when:
    all_of:
      - { activity: agent }
      - { agent_action: add_recipient }
  then:
    status: NOT_PERMITTED
    reason: >-
      Adding a recipient to the allowlist is never done by an agent, on the
      same footing as adding a payee.
    clauses: ["C.2"]
    try_instead: a human adds it, and it is logged
    why_it_matters: >-
      An agent that can extend its own recipient list can eventually reach
      anyone.
    next_step: >-
      A human adds the recipient, and the change is logged (C.2).

- id: agent_deletion
  when:
    all_of:
      - { activity: agent }
      - { agent_action: delete }
  then:
    status: NEEDS_APPROVAL
    approval_kind: per_action
    reason: >-
      Deletion is irreversible without a tested backup, and it is not one of
      the two exceptions. It needs a human for each action, always.
    clauses: ["11.3", "C.2"]
    requirements:
      - "Human approval for each deletion"
    why_it_matters: >-
      Without a tested backup, a deletion is the one action no later review can
      undo.
    next_step: >-
      Have a human approve each deletion, and confirm the backup is tested
      (11.3, C.2).

- id: agent_production_change
  when:
    all_of:
      - { activity: agent }
      - { agent_action: production_change }
  then:
    status: NEEDS_APPROVAL
    approval_kind: per_action
    reason: >-
      A production change without a tested rollback is irreversible, and it is
      not one of the two exceptions. It needs a human for each action, always.
    clauses: ["11.3", "C.2"]
    requirements:
      - "Human approval for each production change"
    why_it_matters: >-
      A production change without a tested rollback takes the whole system with
      it.
    next_step: >-
      Have a human approve each change, and confirm the rollback is tested
      (11.3, C.2).
